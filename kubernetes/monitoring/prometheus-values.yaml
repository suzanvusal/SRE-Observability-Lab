grafana:
  enabled: true
  adminPassword: "admin123"

  service:
    type: LoadBalancer

  persistence:
    enabled: true
    size: 5Gi

prometheus:
  prometheusSpec:
    retention: 10d
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  alertmanagerSpec:
    retention: 120h
