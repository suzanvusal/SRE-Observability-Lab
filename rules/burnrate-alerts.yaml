groups:
- name: slo-burnrate-alerts
  rules:

  - alert: HighBurnRateFast
    expr: |
      (1 - job:request_success_rate:ratio) > (1 - 0.999) * 14.4
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "🔥 High fast burn rate"
      description: "Error budget burning extremely fast!"

  - alert: HighBurnRateSlow
    expr: |
      (1 - job:request_success_rate:ratio) > (1 - 0.999) * 6
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: "⚠️ Slow burn rate"
      description: "SLO error budget slowly draining"
